<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120" width="360" height="120">
  <defs>
    <linearGradient id="vstroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3AA0F0"/>
      <stop offset="1" stop-color="#0B1F3A"/>
    </linearGradient>
  </defs>
  <rect width="360" height="120" fill="#FFFFFF"/>
  <!-- Gold triangle dot on the A -->
  <path d="M40 20 L52 42 L28 42 Z" fill="#F5A623"/>
  <!-- AVD wordmark (angular, bold navy) -->
  <text x="18" y="74" font-family="Poppins, Arial, sans-serif" font-size="52" font-weight="800" fill="#0B1F3A" letter-spacing="2">AVD</text>
  <!-- Gradient diagonal stroke echoing the V/D slash -->
  <path d="M120 92 L200 30 L210 40 L130 102 Z" fill="url(#vstroke)" opacity="0.9"/>
  <!-- 360 | SOLUTION wordmark -->
  <text x="20" y="100" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B1F3A" letter-spacing="3">360</text>
  <circle cx="66" cy="95" r="3" fill="#F5A623"/>
  <text x="78" y="100" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="600" fill="#0B1F3A" letter-spacing="4">SOLUTION</text>
  <!-- Tagline -->
  <text x="200" y="100" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="500" fill="#5B6B82" letter-spacing="1">Elevating Business Performance</text>
</svg>
